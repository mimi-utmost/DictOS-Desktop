[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/dictionary",
    "crates/dictos",
    "crates/history",
    "crates/platform-windows",
    "crates/popup",
    "crates/selection",
    "crates/settings",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
