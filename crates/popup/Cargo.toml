[package]
name = "dictos-popup"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Popup de consulta do DictOS (trait + implementação Slint)"
build = "build.rs"

[dependencies]
dictos-core = { path = "../core" }
dictos-selection = { path = "../selection" }
slint = { version = "1", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
