[package]
name = "dictos"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CLI do DictOS: importar e consultar dicionários"

[dependencies]
dictos-core = { path = "../core" }
dictos-dictionary = { path = "../dictionary" }
dictos-selection = { path = "../selection" }
dictos-settings = { path = "../settings" }
dictos-history = { path = "../history" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[target.'cfg(windows)'.dependencies]
dictos-platform-windows = { path = "../platform-windows" }
dictos-popup = { path = "../popup" }

[dev-dependencies]
tempfile = "3"
